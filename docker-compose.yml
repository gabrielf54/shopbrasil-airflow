# =============================================================================
# ShopBrasil: pipeline de métricas de preço por categoria
# Apache Airflow 2.9 + PostgreSQL (banco interno do Airflow + base analítica)
# =============================================================================
#
# SERVIÇOS:
#   postgres-meta      banco INTERNO do Airflow (runs, estado das tasks, XComs,
#                      connections, pools). O pipeline não grava nada aqui.
#   postgres-analytics base ANALÍTICA da ShopBrasil: é onde o pipeline grava as
#                      métricas que alimentam o painel do time de pricing.
#   airflow-init       roda UMA vez e encerra: migra o banco interno, cria o
#                      usuário admin, a connection "postgres_shopbrasil" e o
#                      pool "ecommerce_pool" (2 slots).
#   airflow-scheduler  lê ./dags, agenda as execuções e executa as tasks.
#   airflow-webserver  interface web: http://localhost:8080
#
# SUBIR DO ZERO:
#   docker compose up -d
#   (Linux/macOS, antes: mkdir -p logs && chmod -R 777 logs)
#
# ACESSO:
#   Airflow UI ......... http://localhost:8080   (admin / admin)
#   Base analítica ..... localhost:5434  (shopbrasil / shopbrasil123 / analytics)
#
# As senhas ficam fixas aqui porque é um projeto de estudo que precisa subir
# com um comando só. Em produção elas viriam de um .env ou de um secrets manager.
# =============================================================================

x-airflow-common: &airflow-common
  # Mesma versão usada nos labs da disciplina. A imagem oficial já traz o
  # provider do Postgres (PostgresHook), requests e pendulum, então não
  # precisamos instalar nada extra.
  image: apache/airflow:2.9.3-python3.11

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd7cA="
    AIRFLOW__WEBSERVER__SECRET_KEY: "shopbrasil-secret-key"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # A DAG nasce LIGADA: o pipeline precisa rodar sozinho às 06:00 sem
    # ninguém entrar na UI para despausar.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    # Horário de Brasília como padrão do Airflow e da interface.
    # (O agendamento da DAG também ancora o fuso no start_date, com pendulum.)
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo

    # Procura arquivos novos em ./dags a cada 30s (o padrão é 5 minutos).
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"

    # Endereço da API de catálogo. Pode ser sobrescrito pela Variable
    # "fakestore_api_url" na UI (útil para simular a API fora do ar).
    FAKESTORE_API_URL: https://fakestoreapi.com

  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins    # operador customizado e callbacks
    - ./logs:/opt/airflow/logs

  depends_on:
    postgres-meta:
      condition: service_healthy

  networks:
    - shopbrasil-net


services:
  postgres-meta:
    image: postgres:16
    container_name: shopbrasil-airflow-meta-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - shopbrasil-net

  postgres-analytics:
    image: postgres:16
    container_name: shopbrasil-analytics-db
    environment:
      POSTGRES_USER: shopbrasil
      POSTGRES_PASSWORD: shopbrasil123
      POSTGRES_DB: analytics
    volumes:
      - postgres-analytics-data:/var/lib/postgresql/data
      # Roda só na PRIMEIRA vez que o volume é criado: cria as tabelas.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # 5434 para não conflitar com um Postgres local (5432) nem com o lab (5433).
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shopbrasil", "-d", "analytics"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - shopbrasil-net

  airflow-init:
    <<: *airflow-common
    container_name: shopbrasil-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate

        airflow users create --username admin --password admin \
          --firstname Admin --lastname ShopBrasil --role Admin \
          --email admin@shopbrasil.local || true   # já existe numa 2ª subida

        # Connection usada pelo PostgresHook. Apaga e recria para que rodar o
        # init de novo não falhe e sempre deixe a connection correta.
        airflow connections delete postgres_shopbrasil > /dev/null 2>&1 || true
        airflow connections add postgres_shopbrasil \
          --conn-type postgres --conn-host postgres-analytics --conn-port 5432 \
          --conn-login shopbrasil --conn-password shopbrasil123 --conn-schema analytics

        # Pool que limita a 2 as tasks mapeadas rodando ao mesmo tempo.
        # "pools set" cria ou atualiza: é idempotente.
        airflow pools set ecommerce_pool 2 "Limita a concorrência do cálculo por categoria"

        echo "=== Airflow inicializado. Acesse http://localhost:8080 (admin/admin) ==="
    depends_on:
      postgres-meta:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: shopbrasil-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--allow-multiple", "--limit", "100"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: shopbrasil-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-meta-data:
  postgres-analytics-data:

networks:
  shopbrasil-net:
    driver: bridge
