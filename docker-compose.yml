# ShopBrasil - Airflow 2.9 + Postgres
# Subir: docker compose up -d  |  UI: http://localhost:8080 (admin/admin)
# Senhas fixas por ser projeto de estudo (em produção iriam para um .env).

x-airflow-common: &airflow-common
  # mesma versão dos labs; já vem com o provider do Postgres
  image: apache/airflow:2.9.3-python3.11

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta/airflow
    AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd7cA="
    AIRFLOW__WEBSERVER__SECRET_KEY: "shopbrasil-secret-key"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # DAG já nasce ligada, sem precisar despausar na UI
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: America/Sao_Paulo

    # procura DAG nova a cada 30s (padrão é 5 min)
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"

    # dá para sobrescrever pela Variable fakestore_api_url (teste de falha)
    FAKESTORE_API_URL: https://fakestoreapi.com

  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    # volume nomeado: o Docker cria já com o dono do Airflow (uid 50000),
    # sem precisar de chmod na pasta no Linux
    - airflow-logs:/opt/airflow/logs

  depends_on:
    postgres-meta:
      condition: service_healthy

  networks:
    - shopbrasil-net


services:
  postgres-meta:
    image: postgres:16
    container_name: shopbrasil-airflow-meta-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - shopbrasil-net

  postgres-analytics:
    image: postgres:16
    container_name: shopbrasil-analytics-db
    environment:
      POSTGRES_USER: shopbrasil
      POSTGRES_PASSWORD: shopbrasil123
      POSTGRES_DB: analytics
    volumes:
      - postgres-analytics-data:/var/lib/postgresql/data
      # só roda quando o volume é criado
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # 5434 para não bater com o Postgres local nem com o do lab
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shopbrasil", "-d", "analytics"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - shopbrasil-net

  airflow-init:
    <<: *airflow-common
    container_name: shopbrasil-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate

        airflow users create --username admin --password admin \
          --firstname Admin --lastname ShopBrasil --role Admin \
          --email admin@shopbrasil.local || true

        # apaga e recria para o init poder rodar de novo sem erro
        airflow connections delete postgres_shopbrasil > /dev/null 2>&1 || true
        airflow connections add postgres_shopbrasil \
          --conn-type postgres --conn-host postgres-analytics --conn-port 5432 \
          --conn-login shopbrasil --conn-password shopbrasil123 --conn-schema analytics

        airflow pools set ecommerce_pool 2 "Limita a concorrência do cálculo por categoria"

        echo "init ok"
    depends_on:
      postgres-meta:
        condition: service_healthy
      postgres-analytics:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: shopbrasil-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--allow-multiple", "--limit", "100"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    container_name: shopbrasil-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-meta-data:
  postgres-analytics-data:
  airflow-logs:

networks:
  shopbrasil-net:
    driver: bridge
